name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check that tag and manifest version match
        run: |
          MANIFEST=$(grep -oP '(?<=<version>)[^<]+' plugin/doctidy.xml)
          if [ "v$MANIFEST" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match manifest version $MANIFEST"; exit 1
          fi

      - name: Build package
        run: python3 build.py

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/*.zip \
            --title "DocTidy ${GITHUB_REF_NAME#v}" \
            --notes "See [CHANGELOG.md](CHANGELOG.md). Install the ZIP via System → Install → Extensions."
