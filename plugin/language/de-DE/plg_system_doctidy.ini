PLG_SYSTEM_DOCTIDY="System - DocTidy"
PLG_SYSTEM_DOCTIDY_XML_DESCRIPTION="Räumt die Seitenausgabe auf: lädt Font Awesome aus der lokalen Joomla-Kopie statt von einem CDN, sorgt für genau eine H1 auf EDocman-Seiten und kann EDocman-Seitentitel anpassen."
PLG_SYSTEM_DOCTIDY_LOCAL_FA_LABEL="Font Awesome lokal"
PLG_SYSTEM_DOCTIDY_LOCAL_FA_DESC="Ersetzt Font-Awesome-Stylesheets von öffentlichen CDNs (cdnjs, jsDelivr, use.fontawesome.com, BootstrapCDN) durch die lokale Joomla-Kopie. Es wird keine IP-Adresse von Besuchern an Dritte übertragen."
PLG_SYSTEM_DOCTIDY_LOCAL_FA_SCOPE_LABEL="Anwenden auf"
PLG_SYSTEM_DOCTIDY_LOCAL_FA_SCOPE_DESC="CDN-Link auf allen Seiten oder nur auf EDocman-Seiten ersetzen."
PLG_SYSTEM_DOCTIDY_SCOPE_ALL="Alle Seiten"
PLG_SYSTEM_DOCTIDY_SCOPE_EDOCMAN="Nur EDocman-Seiten"
PLG_SYSTEM_DOCTIDY_SINGLE_H1_LABEL="Eine H1 auf Dokumentseiten"
PLG_SYSTEM_DOCTIDY_SINGLE_H1_DESC="EDocman gibt den Dokumenttitel zweimal als H1 aus (Desktop- und Handy-Kopf). Der Handy-Titel wird zu einem normalen Blockelement."
PLG_SYSTEM_DOCTIDY_LIST_HEADLINES_LABEL="Keine H1 in Dokumentlisten"
PLG_SYSTEM_DOCTIDY_LIST_HEADLINES_DESC="H1-Überschriften in den Dokumentbeschreibungen der EDocman-Listen werden zu gestaltbaren Absätzen."
PLG_SYSTEM_DOCTIDY_LIST_HEADLINE_CLASS_LABEL="CSS-Klasse für diese Überschriften"
PLG_SYSTEM_DOCTIDY_LIST_HEADLINE_CLASS_DESC="Klasse des Absatzes, der die H1 ersetzt – für das CSS des Templates."
PLG_SYSTEM_DOCTIDY_TITLE_LABEL="EDocman-Seitentitel anpassen"
PLG_SYSTEM_DOCTIDY_TITLE_DESC="Entfernt ein Präfix aus dem Browser-Titel von EDocman-Seiten und hängt einen Zusatz an."
PLG_SYSTEM_DOCTIDY_TITLE_PREFIX_LABEL="Präfix entfernen"
PLG_SYSTEM_DOCTIDY_TITLE_PREFIX_DESC="Text am Anfang des Titels, der entfernt wird, inklusive Trennzeichen, z. B. 'Meine Seite - '. Nur Titel, die damit beginnen, werden angepasst. Leer = alle EDocman-Titel anpassen."
PLG_SYSTEM_DOCTIDY_TITLE_SUFFIX_CATEGORY_LABEL="Zusatz für Kategorien"
PLG_SYSTEM_DOCTIDY_TITLE_SUFFIX_CATEGORY_DESC="Wird an Kategorie- und Listenseiten angehängt, z. B. ' – Berichte | Meine Seite'."
PLG_SYSTEM_DOCTIDY_TITLE_SUFFIX_DOCUMENT_LABEL="Zusatz für Dokumente"
PLG_SYSTEM_DOCTIDY_TITLE_SUFFIX_DOCUMENT_DESC="Wird an Dokumentseiten angehängt, z. B. ' – Bericht | Meine Seite'."
