PLG_SYSTEM_DOCTIDY="System - DocTidy"
PLG_SYSTEM_DOCTIDY_XML_DESCRIPTION="Räumt die Seitenausgabe auf: lädt Font Awesome aus der lokalen Joomla-Kopie statt von einem CDN, sorgt für genau eine H1 auf EDocman-Seiten und kann EDocman-Seitentitel anpassen."

PLG_SYSTEM_DOCTIDY_NOTE_PRIVACY_LABEL="Datenschutz: Symbole vom eigenen Server"
PLG_SYSTEM_DOCTIDY_NOTE_PRIVACY_DESC="Viele Erweiterungen (z. B. EDocman) laden die Symbolschrift Font Awesome von einem fremden Server (CDN, z. B. cdnjs.cloudflare.com). Dabei erhält dieser Server bei jedem Seitenaufruf die IP-Adresse des Besuchers – ohne Einwilligung datenschutzrechtlich problematisch (DSGVO). DocTidy ersetzt diesen Link durch die Kopie, die Joomla ohnehin mitbringt. Die Symbole sehen gleich aus."
PLG_SYSTEM_DOCTIDY_LOCAL_FA_LABEL="Font Awesome lokal"
PLG_SYSTEM_DOCTIDY_LOCAL_FA_DESC="Empfohlen: Ja. Ersetzt Font-Awesome-Links von cdnjs, jsDelivr, use.fontawesome.com und BootstrapCDN durch die lokale Joomla-Kopie; doppelte Einbindungen werden entfernt. Ohne passende lokale Datei bleibt die Seite unverändert. Nur ausschalten, wenn das Template bewusst eine neuere CDN-Version braucht und Symbole fehlen."
PLG_SYSTEM_DOCTIDY_LOCAL_FA_SCOPE_LABEL="Anwenden auf"
PLG_SYSTEM_DOCTIDY_LOCAL_FA_SCOPE_DESC="'Alle Seiten' (empfohlen) erfasst auch Templates, Module und andere Erweiterungen. 'Nur EDocman-Seiten' wählen, wenn andere Seiten absichtlich eine eigene CDN-Version nutzen."
PLG_SYSTEM_DOCTIDY_SCOPE_ALL="Alle Seiten"
PLG_SYSTEM_DOCTIDY_SCOPE_EDOCMAN="Nur EDocman-Seiten"

PLG_SYSTEM_DOCTIDY_NOTE_HEADINGS_LABEL="Überschriften: genau eine H1 pro Seite"
PLG_SYSTEM_DOCTIDY_NOTE_HEADINGS_DESC="Die H1 ist die Hauptüberschrift einer Seite. Suchmaschinen und Vorleseprogramme für Sehbehinderte erwarten genau eine. EDocman erzeugt auf Dokumentseiten und in Dokumentlisten oft mehrere. Die folgenden Schalter ändern nur die Ausgabe – Inhalte in EDocman bleiben unverändert."
PLG_SYSTEM_DOCTIDY_SINGLE_H1_LABEL="Eine H1 auf Dokumentseiten"
PLG_SYSTEM_DOCTIDY_SINGLE_H1_DESC="Empfohlen: Ja. EDocman 4 schreibt den Dokumenttitel zweimal als H1 (Desktop- und Handy-Kopf, sichtbar ist jeweils einer). Der Handy-Titel wird zu einem normalen Element mit derselben CSS-Klasse – optisch ändert sich nichts. Bei älteren EDocman-Versionen ohne Handy-Kopf wirkungslos."
PLG_SYSTEM_DOCTIDY_LIST_HEADLINES_LABEL="Keine H1 in Dokumentlisten"
PLG_SYSTEM_DOCTIDY_LIST_HEADLINES_DESC="Empfohlen: Ja. Beginnt die Kurzbeschreibung eines Dokuments mit einer Überschrift, steht in Listen (z. B. Jahresübersicht) für jedes Dokument eine weitere H1. Diese werden zu Absätzen mit der CSS-Klasse aus dem nächsten Feld. Ohne passendes CSS erscheinen sie als normaler Text – siehe Anleitung."
PLG_SYSTEM_DOCTIDY_LIST_HEADLINE_CLASS_LABEL="CSS-Klasse für diese Überschriften"
PLG_SYSTEM_DOCTIDY_LIST_HEADLINE_CLASS_DESC="Klasse der Absätze, die die H1 ersetzen. Standard: doctidy-headline. Nur ändern, wenn das Template eine passende Klasse hat (z. B. uk-h4 bei YOOtheme). Mehrere Klassen mit Leerzeichen trennen."

PLG_SYSTEM_DOCTIDY_NOTE_TITLES_LABEL="Seitentitel für Suchmaschinen"
PLG_SYSTEM_DOCTIDY_NOTE_TITLES_DESC="Der Seitentitel steht im Browser-Tab und als blaue Überschrift in den Google-Ergebnissen. EDocman bildet ihn oft als 'Seitenname - Dokument'. Für Suchmaschinen ist es besser, wenn der aussagekräftige Teil vorne steht. Optional – nur einschalten, wenn die Titel angepasst werden sollen."
PLG_SYSTEM_DOCTIDY_TITLE_LABEL="EDocman-Seitentitel anpassen"
PLG_SYSTEM_DOCTIDY_TITLE_DESC="Entfernt auf EDocman-Seiten ein Präfix aus dem Titel und hängt einen Zusatz an. Seiten mit eigenem Titel (z. B. aus dem Menüpunkt) bleiben unverändert, solange sie nicht mit dem Präfix beginnen."
PLG_SYSTEM_DOCTIDY_TITLE_PREFIX_LABEL="Präfix entfernen"
PLG_SYSTEM_DOCTIDY_TITLE_PREFIX_DESC="Titelanfang, der entfernt wird – genau so wie im Browser-Tab, inklusive Trennzeichen und Leerzeichen am Ende. Nur Titel, die damit beginnen, werden angepasst (sichere Variante). Leer = alle EDocman-Titel bekommen den Zusatz."
PLG_SYSTEM_DOCTIDY_TITLE_PREFIX_HINT="z. B. Meine Seite - "
PLG_SYSTEM_DOCTIDY_TITLE_SUFFIX_CATEGORY_LABEL="Zusatz für Kategorien"
PLG_SYSTEM_DOCTIDY_TITLE_SUFFIX_CATEGORY_DESC="Wird an Kategorie- und Listenseiten angehängt, mit führendem Trennzeichen. Beispiel: aus 'Meine Seite - 2026' wird '2026 – Berichte | Meine Seite'. Leer = kein Zusatz."
PLG_SYSTEM_DOCTIDY_TITLE_SUFFIX_CATEGORY_HINT="z. B.  – Berichte | Meine Seite"
PLG_SYSTEM_DOCTIDY_TITLE_SUFFIX_DOCUMENT_LABEL="Zusatz für Dokumente"
PLG_SYSTEM_DOCTIDY_TITLE_SUFFIX_DOCUMENT_DESC="Wird an einzelne Dokumentseiten angehängt. Beispiel: aus 'Meine Seite - Newsletter 2026-10-18' wird 'Newsletter 2026-10-18 – Bericht | Meine Seite'. Tipp: ganze Titel unter ca. 60 Zeichen halten, sonst kürzt Google sie."
PLG_SYSTEM_DOCTIDY_TITLE_SUFFIX_DOCUMENT_HINT="z. B.  – Bericht | Meine Seite"
