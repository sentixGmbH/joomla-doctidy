PLG_SYSTEM_DOCTIDY="System - DocTidy"
PLG_SYSTEM_DOCTIDY_XML_DESCRIPTION="Tidies up the page output: loads Font Awesome from the local Joomla copy instead of a CDN, keeps a single H1 on EDocman pages and can rewrite EDocman page titles."
PLG_SYSTEM_DOCTIDY_LOCAL_FA_LABEL="Font Awesome locally"
PLG_SYSTEM_DOCTIDY_LOCAL_FA_DESC="Replaces Font Awesome stylesheets from public CDNs (cdnjs, jsDelivr, use.fontawesome.com, BootstrapCDN) with Joomla's local copy. No visitor IP address is sent to a third party."
PLG_SYSTEM_DOCTIDY_LOCAL_FA_SCOPE_LABEL="Apply on"
PLG_SYSTEM_DOCTIDY_LOCAL_FA_SCOPE_DESC="Replace the CDN link on all pages or only on EDocman pages."
PLG_SYSTEM_DOCTIDY_SCOPE_ALL="All pages"
PLG_SYSTEM_DOCTIDY_SCOPE_EDOCMAN="EDocman pages only"
PLG_SYSTEM_DOCTIDY_SINGLE_H1_LABEL="One H1 on document pages"
PLG_SYSTEM_DOCTIDY_SINGLE_H1_DESC="EDocman prints the document title twice as H1 (desktop and mobile header). The mobile one becomes a normal block element."
PLG_SYSTEM_DOCTIDY_LIST_HEADLINES_LABEL="No H1 in document lists"
PLG_SYSTEM_DOCTIDY_LIST_HEADLINES_DESC="H1 headlines inside document descriptions in EDocman lists become styled paragraphs."
PLG_SYSTEM_DOCTIDY_LIST_HEADLINE_CLASS_LABEL="CSS class for these headlines"
PLG_SYSTEM_DOCTIDY_LIST_HEADLINE_CLASS_DESC="Class of the paragraph that replaces the H1 – use it in your template CSS."
PLG_SYSTEM_DOCTIDY_TITLE_LABEL="Rewrite EDocman page titles"
PLG_SYSTEM_DOCTIDY_TITLE_DESC="Removes a prefix from the browser title of EDocman pages and adds a suffix."
PLG_SYSTEM_DOCTIDY_TITLE_PREFIX_LABEL="Remove prefix"
PLG_SYSTEM_DOCTIDY_TITLE_PREFIX_DESC="Text at the beginning of the title to remove, including the separator, e.g. 'My Site - '. Only titles starting with this text are rewritten. Empty = rewrite all EDocman titles."
PLG_SYSTEM_DOCTIDY_TITLE_SUFFIX_CATEGORY_LABEL="Suffix for categories"
PLG_SYSTEM_DOCTIDY_TITLE_SUFFIX_CATEGORY_DESC="Appended to category and list pages, e.g. ' – Reports | My Site'."
PLG_SYSTEM_DOCTIDY_TITLE_SUFFIX_DOCUMENT_LABEL="Suffix for documents"
PLG_SYSTEM_DOCTIDY_TITLE_SUFFIX_DOCUMENT_DESC="Appended to document pages, e.g. ' – Report | My Site'."
