PLG_SYSTEM_DOCTIDY="System - DocTidy"
PLG_SYSTEM_DOCTIDY_XML_DESCRIPTION="Tidies up the page output: loads Font Awesome from the local Joomla copy instead of a CDN, keeps a single H1 on EDocman pages and can rewrite EDocman page titles."

PLG_SYSTEM_DOCTIDY_NOTE_PRIVACY_LABEL="Privacy: icons from your own server"
PLG_SYSTEM_DOCTIDY_NOTE_PRIVACY_DESC="Many extensions (e.g. EDocman) load the Font Awesome icon font from a third-party server (CDN, e.g. cdnjs.cloudflare.com). That server receives the visitor's IP address on every page view – problematic under the GDPR without consent. DocTidy replaces the link with the copy Joomla already ships. The icons look the same."
PLG_SYSTEM_DOCTIDY_LOCAL_FA_LABEL="Font Awesome locally"
PLG_SYSTEM_DOCTIDY_LOCAL_FA_DESC="Recommended: Yes. Replaces Font Awesome links from cdnjs, jsDelivr, use.fontawesome.com and BootstrapCDN with the local Joomla copy; duplicate includes are removed. Without a suitable local file the page stays unchanged. Only switch off if your template deliberately needs a newer CDN version and icons are missing."
PLG_SYSTEM_DOCTIDY_LOCAL_FA_SCOPE_LABEL="Apply on"
PLG_SYSTEM_DOCTIDY_LOCAL_FA_SCOPE_DESC="'All pages' (recommended) also covers templates, modules and other extensions. Choose 'EDocman pages only' if other pages intentionally use their own CDN version."
PLG_SYSTEM_DOCTIDY_SCOPE_ALL="All pages"
PLG_SYSTEM_DOCTIDY_SCOPE_EDOCMAN="EDocman pages only"

PLG_SYSTEM_DOCTIDY_NOTE_HEADINGS_LABEL="Headings: exactly one H1 per page"
PLG_SYSTEM_DOCTIDY_NOTE_HEADINGS_DESC="The H1 is the main heading of a page. Search engines and screen readers expect exactly one. EDocman often creates several on document pages and in document lists. The following switches only change the output – your EDocman content stays untouched."
PLG_SYSTEM_DOCTIDY_SINGLE_H1_LABEL="One H1 on document pages"
PLG_SYSTEM_DOCTIDY_SINGLE_H1_DESC="Recommended: Yes. EDocman 4 prints the document title twice as H1 (desktop and mobile header, only one is visible). The mobile one becomes a normal element with the same CSS class – no visual change. No effect on older EDocman versions without a mobile header."
PLG_SYSTEM_DOCTIDY_LIST_HEADLINES_LABEL="No H1 in document lists"
PLG_SYSTEM_DOCTIDY_LIST_HEADLINES_DESC="Recommended: Yes. If a document's short description starts with a heading, lists (e.g. a yearly overview) contain one more H1 per document. These become paragraphs with the CSS class from the next field. Without matching CSS they appear as plain text – see the documentation."
PLG_SYSTEM_DOCTIDY_LIST_HEADLINE_CLASS_LABEL="CSS class for these headlines"
PLG_SYSTEM_DOCTIDY_LIST_HEADLINE_CLASS_DESC="Class of the paragraphs replacing the H1. Default: doctidy-headline. Only change it if your template has a matching class (e.g. uk-h4 for YOOtheme). Separate several classes with spaces."

PLG_SYSTEM_DOCTIDY_NOTE_TITLES_LABEL="Page titles for search engines"
PLG_SYSTEM_DOCTIDY_NOTE_TITLES_DESC="The page title is shown in the browser tab and as the blue headline in Google results. EDocman often builds it as 'Site name - Document'. For search engines it is better to have the meaningful part first. Optional – only enable if titles should be rewritten."
PLG_SYSTEM_DOCTIDY_TITLE_LABEL="Rewrite EDocman page titles"
PLG_SYSTEM_DOCTIDY_TITLE_DESC="Removes a prefix from the title of EDocman pages and appends a suffix. Pages with their own title (e.g. from the menu item) stay untouched unless they start with the prefix."
PLG_SYSTEM_DOCTIDY_TITLE_PREFIX_LABEL="Remove prefix"
PLG_SYSTEM_DOCTIDY_TITLE_PREFIX_DESC="Beginning of the title to remove – exactly as shown in the browser tab, including separator and trailing space. Only titles starting with it are rewritten (safe option). Empty = all EDocman titles get the suffix."
PLG_SYSTEM_DOCTIDY_TITLE_PREFIX_HINT="e.g. My Site - "
PLG_SYSTEM_DOCTIDY_TITLE_SUFFIX_CATEGORY_LABEL="Suffix for categories"
PLG_SYSTEM_DOCTIDY_TITLE_SUFFIX_CATEGORY_DESC="Appended to category and list pages, with a leading separator. Example: 'My Site - 2026' becomes '2026 – Reports | My Site'. Empty = no suffix."
PLG_SYSTEM_DOCTIDY_TITLE_SUFFIX_CATEGORY_HINT="e.g.  – Reports | My Site"
PLG_SYSTEM_DOCTIDY_TITLE_SUFFIX_DOCUMENT_LABEL="Suffix for documents"
PLG_SYSTEM_DOCTIDY_TITLE_SUFFIX_DOCUMENT_DESC="Appended to single document pages. Example: 'My Site - Newsletter 2026-10-18' becomes 'Newsletter 2026-10-18 – Report | My Site'. Tip: keep complete titles below about 60 characters, otherwise Google truncates them."
PLG_SYSTEM_DOCTIDY_TITLE_SUFFIX_DOCUMENT_HINT="e.g.  – Report | My Site"
